<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>学習ノート</title>

  <link rel="icon" href="data/image.png">
  
  <!-- KaTeX -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"
          onload="onKaTeXReady()"></script>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Noto+Sans+JP:wght@400;500;700;900&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet" />

  <style>
    /* ── Token ── */
    :root {
      --bg:      #F5F4EF;
      --surface: #FFFFFF;
      --ink:     #1C1C1C;
      --ink-2:   #888888;
      --line:    #DDDBD5;
      --accent:  #3730A3;
      --ok:      #166534;
      --ng:      #991B1B;
      --r: 10px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Noto Sans JP', sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
    }
    button { cursor: pointer; font-family: inherit; border: none; background: none; color: inherit; }

    /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
       SPLASH
    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
    #splash {
      position: fixed;
      inset: 0;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 900;
      transition: opacity .7s ease;
    }
    #splash.out {
      opacity: 0;
      pointer-events: none;
    }

    .splash-inner {
      position: relative;
      display: inline-block;
    }

    .splash-site-title {
      font-size: 2.4rem;
      font-weight: 900;
      letter-spacing: -.03em;
      opacity: 0;
      transform: translateY(10px);
      animation: s-up .55s ease .25s forwards;
    }
    .splash-by {
      position: absolute;
      right: 0;
      bottom: -1.4em;
      font-family: 'Great Vibes', cursive;
      font-size: 1.05rem;
      color: var(--ink-2);
      will-change: clip-path;
      clip-path: inset(0 100% 0 0);
      animation: s-write 1.1s cubic-bezier(.4,0,.2,1) .75s forwards;
      white-space: nowrap;
    }

    @keyframes s-up    { to { opacity:1; transform:translateY(0); } }
    @keyframes s-write { to { clip-path: inset(0 0% 0 0); } }

    /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
       LAYOUT
    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
    .site-header {
      background: var(--surface);
      border-bottom: 1px solid var(--line);
      padding: 15px 28px;
      display: flex;
      align-items: center;
      gap: 11px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .site-header h1 {
      font-size: 1.1rem;
      font-weight: 900;
      letter-spacing: -.02em;
    }
    .home-link {
      margin-left: auto;
      font-size: .82rem;
      color: var(--ink-2);
      padding: 5px 14px;
      border-radius: 20px;
      border: 1px solid var(--line);
      transition: border-color .15s, color .15s;
    }
    .home-link:hover { border-color: var(--ink-2); color: var(--ink); }

    /* ── Page fade ── */
    #app {
      max-width: 880px;
      margin: 0 auto;
      padding: 36px 20px 80px;
      transition: opacity .22s ease, transform .22s ease;
    }
    #app.fading {
      opacity: 0;
      transform: translateY(9px);
    }

    /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
       STATES
    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
    .loading-state {
      text-align: center;
      padding: 80px 20px;
      color: var(--ink-2);
    }
    .spinner {
      width: 30px;
      height: 30px;
      border: 2px solid var(--line);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .75s linear infinite;
      margin: 0 auto 14px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .error-box {
      border: 1px solid var(--line);
      border-radius: var(--r);
      padding: 20px 24px;
      color: var(--ink-2);
      line-height: 1.9;
      font-size: .88rem;
    }
    .error-box code {
      font-family: monospace;
      background: var(--bg);
      padding: 1px 5px;
      border-radius: 3px;
      color: var(--ink);
    }

    /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
       SHARED COMPONENTS
    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
    .back-btn {
      color: var(--ink-2);
      font-size: .82rem;
      margin-bottom: 24px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 14px;
      border-radius: 20px;
      border: 1px solid var(--line);
      transition: border-color .14s, color .14s;
    }
    .back-btn:hover { border-color: var(--ink-2); color: var(--ink); }

    .page-title {
      font-size: 1.4rem;
      font-weight: 900;
      letter-spacing: -.025em;
      margin-bottom: 24px;
    }

    /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
       HOME — subject grid
    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
    .subjects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(255px, 1fr));
      gap: 12px;
    }

    .subject-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--r);
      padding: 20px 20px 17px;
      display: flex;
      align-items: flex-start;
      gap: 15px;
      cursor: pointer;
      transition: border-color .17s, box-shadow .17s, transform .17s;
    }
    .subject-card:hover {
      border-color: var(--accent);
      box-shadow: 0 4px 18px rgba(0,0,0,.07);
      transform: translateY(-2px);
    }
    .subject-emoji   { font-size: 1.9rem; line-height: 1; flex-shrink: 0; margin-top: 1px; }
    .subject-name    { font-size: 1rem; font-weight: 700; margin-bottom: 8px; }
    .count-badges    { display: flex; gap: 6px; flex-wrap: wrap; }
    .count-badge {
      font-size: .71rem;
      color: var(--ink-2);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 2px 9px;
    }

    /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
       SUBJECT detail
    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
    .subject-header {
      display: flex;
      align-items: center;
      gap: 13px;
      margin-bottom: 28px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--line);
    }
    .subject-icon-lg { font-size: 2.1rem; }
    .subject-header h2 {
      font-size: 1.55rem;
      font-weight: 900;
      letter-spacing: -.025em;
    }

    .mat-section      { margin-bottom: 26px; }
    .mat-label {
      font-size: .7rem;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--ink-2);
      margin-bottom: 9px;
    }
    .mat-list         { display: flex; flex-direction: column; gap: 7px; }

    .mat-item {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--r);
      padding: 13px 17px;
      display: flex;
      align-items: center;
      gap: 13px;
      transition: border-color .14s;
    }
    .mat-item:hover   { border-color: var(--ink-2); }
    .mat-icon         { font-size: 1.15rem; flex-shrink: 0; }
    .mat-title        { flex: 1; font-size: .93rem; font-weight: 500; }
    .open-btn {
      background: var(--accent);
      color: #fff;
      border-radius: 7px;
      padding: 6px 15px;
      font-size: .8rem;
      font-weight: 700;
      flex-shrink: 0;
      transition: opacity .14s;
    }
    .open-btn:hover   { opacity: .82; }

    /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
       QUIZ
    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
    .quiz-wrap   { max-width: 650px; margin: 0 auto; }
    .quiz-meta   { margin-bottom: 20px; }
    .quiz-title  {
      font-size: 1.25rem;
      font-weight: 900;
      letter-spacing: -.02em;
      margin-bottom: 12px;
    }
    .prog-bar    { height: 3px; background: var(--line); border-radius: 2px; overflow: hidden; margin-bottom: 6px; }
    .prog-fill   { height: 100%; background: var(--accent); border-radius: 2px; transition: width .35s ease; }
    .prog-text   { font-size: .78rem; color: var(--ink-2); font-family: 'Space Grotesk', sans-serif; }

    .quiz-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--r);
      padding: 26px;
      margin-bottom: 11px;
    }
    .q-text {
      font-size: 1.05rem;
      font-weight: 700;
      line-height: 1.85;
      margin-bottom: 20px;
    }
    .q-text .katex         { font-size: 1em; }
    .q-text .katex-display { margin: .5em 0; }

    .choices { display: flex; flex-direction: column; gap: 8px; }
    .choices .choice-btn { flex: 1; }

    .choice-btn {
      background: var(--bg);
      border: 1.5px solid var(--line);
      border-radius: var(--r);
      padding: 11px 16px;
      display: flex;
      align-items: center;
      gap: 13px;
      font-size: .93rem;
      font-weight: 500;
      text-align: left;
      width: 100%;
      transition: border-color .13s, background .13s;
    }
    .choice-btn:not(:disabled):hover { background: var(--surface); border-color: var(--ink-2); }
    .choice-btn:disabled              { cursor: default; }

    .badge {
      width: 27px;
      height: 27px;
      border-radius: 50%;
      background: var(--ink);
      color: var(--surface);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Space Grotesk', sans-serif;
      font-size: .78rem;
      font-weight: 700;
      flex-shrink: 0;
      transition: background .2s;
    }
    .choice-btn.correct              { background: #F0FAF3; border-color: var(--ok); }
    .choice-btn.correct .badge       { background: var(--ok); }
    .choice-btn.wrong                { background: #FEF2F2; border-color: var(--ng); }
    .choice-btn.wrong .badge         { background: var(--ng); }

    .explain-box {
      background: var(--bg);
      border-left: 3px solid var(--accent);
      border-radius: 0 var(--r) var(--r) 0;
      padding: 11px 16px;
      font-size: .86rem;
      line-height: 1.85;
      margin-top: 13px;
      color: var(--ink-2);
    }
    .explain-box .katex { font-size: .97em; }

    /* ── Quiz animations ── */
    @keyframes card-enter {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes card-leave {
      from { opacity: 1; transform: translateX(0)     scale(1); }
      to   { opacity: 0; transform: translateX(-28px) scale(.97); }
    }
    @keyframes pop-correct {
      0%   { transform: scale(1); }
      45%  { transform: scale(1.035); }
      100% { transform: scale(1); }
    }
    @keyframes shake-wrong {
      0%,100% { transform: translateX(0); }
      18%  { transform: translateX(-7px); }
      36%  { transform: translateX( 7px); }
      54%  { transform: translateX(-4px); }
      72%  { transform: translateX( 4px); }
    }
    @keyframes explain-in {
      from { opacity: 0; transform: translateY(7px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes result-in {
      from { opacity: 0; transform: scale(.92); }
      to   { opacity: 1; transform: scale(1); }
    }
    @keyframes emoji-bounce {
      0%,100% { transform: translateY(0); }
      40%     { transform: translateY(-10px); }
      70%     { transform: translateY(-5px); }
    }

    .quiz-card              { animation: card-enter .32s cubic-bezier(.22,.68,0,1.2); }
    .quiz-card.leaving      { animation: card-leave .18s ease forwards; }
    .quiz-card.no-anim      { animation: none; }
    .choice-btn.correct     { animation: pop-correct  .38s ease; }
    .choice-btn.wrong       { animation: shake-wrong  .42s ease; }
    .explain-box            { animation: explain-in   .3s  ease; }
    .result-card            { animation: result-in    .4s  cubic-bezier(.34,1.56,.64,1); }
    .result-emoji.bounce    { animation: emoji-bounce .6s  ease .15s; }

    .next-btn {
      background: var(--accent);
      color: #fff;
      border-radius: var(--r);
      padding: 12px;
      font-size: .93rem;
      font-weight: 700;
      width: 100%;
      transition: opacity .14s;
    }
    .next-btn:hover { opacity: .83; }

    /* ── Result ── */
    .result-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--r);
      padding: 52px 30px;
      text-align: center;
    }
    .result-emoji  { font-size: 2.6rem; margin-bottom: 16px; }
    .result-score  {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 4.2rem;
      font-weight: 700;
      letter-spacing: -.04em;
      line-height: 1;
      margin-bottom: 5px;
    }
    .result-denom  { font-size: 1.5rem; color: var(--ink-2); }
    .result-pct    { font-size: .88rem; color: var(--ink-2); margin-bottom: 12px; }
    .result-msg    { font-size: 1.05rem; font-weight: 700; margin-bottom: 34px; }
    .result-acts   { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

    .btn-fill {
      background: var(--accent);
      color: #fff;
      border-radius: var(--r);
      padding: 10px 26px;
      font-size: .88rem;
      font-weight: 700;
      transition: opacity .14s;
    }
    .btn-fill:hover  { opacity: .83; }
    .btn-ghost {
      border: 1.5px solid var(--line);
      border-radius: var(--r);
      padding: 10px 26px;
      font-size: .88rem;
      font-weight: 700;
      transition: border-color .14s;
    }
    .btn-ghost:hover { border-color: var(--ink-2); }

    /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
       VIEWER
    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
    .pdf-frame {
      width: 100%;
      height: 74vh;
      border: 1px solid var(--line);
      border-radius: var(--r);
      display: block;
    }
    .img-viewer     { text-align: center; }
    .img-viewer img {
      max-width: 100%;
      border-radius: var(--r);
      border: 1px solid var(--line);
    }

    /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
       FOOTER
    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
    .site-footer {
      border-top: 1px solid var(--line);
      padding: 18px 28px;
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: .78rem;
      color: var(--ink-2);
    }
    .footer-terms-link {
      font-size: .78rem;
      color: var(--ink-2);
      text-decoration: underline;
      text-underline-offset: 3px;
      transition: color .14s;
    }
    .footer-terms-link:hover { color: var(--ink); }

    /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
       TERMS
    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
    .terms-wrap { max-width: 680px; }
    .terms-wrap h1 {
      font-size: 1.4rem;
      font-weight: 900;
      letter-spacing: -.025em;
      margin-bottom: 6px;
    }
    .terms-updated {
      font-size: .78rem;
      color: var(--ink-2);
      margin-bottom: 32px;
    }
    .terms-section { margin-bottom: 30px; }
    .terms-section h2 {
      font-size: .7rem;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--ink-2);
      margin-bottom: 10px;
      padding-bottom: 7px;
      border-bottom: 1px solid var(--line);
    }
    .terms-section p {
      font-size: .9rem;
      line-height: 1.95;
      color: var(--ink);
    }
    .terms-section ul {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }
    .terms-section ul li {
      font-size: .9rem;
      line-height: 1.8;
      padding-left: 1.2em;
      position: relative;
      color: var(--ink);
    }
    .terms-section ul li::before {
      content: '—';
      position: absolute;
      left: 0;
      color: var(--ink-2);
    }

    /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
       RESPONSIVE
    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
    @media (max-width: 560px) {
      #app           { padding: 22px 14px 60px; }
      .subjects-grid { grid-template-columns: 1fr; }
      .quiz-card     { padding: 18px 14px; }
      .result-card   { padding: 38px 16px; }
      .result-acts   { flex-direction: column; }
    }

    /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
       UPDATE — 共通パーツ（ジャンプ・一覧・トースト）
    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .tool-btn {
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 5px 13px;
      font-size: .8rem;
      color: var(--ink-2);
      background: var(--surface);
      white-space: nowrap;

    .quiz-tools {

    .nav-row { display: flex; gap: 10px; }
    .nav-row .prev-btn {

    .next-btn.skip {

    #toast {
      position: fixed;
      left: 50%;
      bottom: 28px;
      transform: translate(-50%, 12px);
      background: var(--ink);
      color: #fff;
      padding: 9px 18px;
      border-radius: 20px;
      font-size: .84rem;

    }
    #toast.show { opacity: 1; transform: translate(-50%, 0); }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }

    /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
       UPDATE — 検索・グループ・ダウンロード
    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
    .site-header .home-link   { margin-left: 0; }

    .dl-btn {
      flex-shrink: 0;

      display: flex;

    .search-box input {

    .scope-chip button:hover { background: var(--bg); }
    .search-status { font-size: .78rem; color: var(--ink-2); margin: 14px 2px 18px; min-height: 1.2em; }
    .search-more   { font-size: .8rem; color: var(--ink-2); margin: 4px 2px 0; }

    .s-quiz {
      background: var(--surface);

    .s-quiz-head {
      padding: 11px 16px;

    }

    .s-hit {
      display: flex;

    /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
       UPDATE — 手書き問題（type: "write"）
    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
    .w-hint { font-size: .78rem; color: var(--ink-2); margin: 2px 0 4px; }
    .wbox-row { display: flex; flex-wrap: wrap; gap: 12px; margin: 14px 0 4px; }
    .wcell { display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .wbox {
      position: relative;
      aspect-ratio: 1;
      max-width: 100%;
      border: 2px solid var(--line);
      border-radius: 10px;
      overflow: hidden;
      background:
        linear-gradient(to right,  transparent calc(50% - .5px), #E4DFD8 calc(50% - .5px), #E4DFD8 calc(50% + .5px), transparent calc(50% + .5px)),
        linear-gradient(to bottom, transparent calc(50% - .5px), #E4DFD8 calc(50% - .5px), #E4DFD8 calc(50% + .5px), transparent calc(50% + .5px)),

    .wbox canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: crosshair; }
    .wbox.locked canvas { cursor: default; }
    .wbox.active { border-color: var(--accent); }
    .wbox.ok { border-color: var(--ok); }
    .wbox.ng { border-color: var(--ng); }
    .wbox-no {

    .w-check {

    }

    .w-accept { font-size: .76rem; color: var(--ink-2); display: inline-flex; align-items: center; gap: 5px; }
    .w-accept select {
      font: inherit; font-size: .78rem; color: var(--ink);
      border: 1px solid var(--line); border-radius: 8px; padding: 3px 6px; background: var(--surface);
    }
    .w-status { font-size: .78rem; color: var(--ink-2); margin-top: 10px; line-height: 1.7; }
    .w-answer {
      display: flex; align-items: baseline; gap: 12px;

      background: var(--bg); border: 1px solid var(--line); border-radius: var(--r);
    }
    .w-answer-label { font-size: .74rem; font-weight: 700; color: var(--ink-2); }
    .w-answer-text  { font-size: 1.5rem; font-weight: 700; letter-spacing: .06em; }
    .w-judge { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 12px; font-size: .78rem; color: var(--ink-2); }
    .tool-btn.on-ok { border-color: var(--ok); color: var(--ok); background: #F0FAF3; font-weight: 700; }
    .tool-btn.on-ng { border-color: var(--ng); color: var(--ng); background: #FEF2F2; font-weight: 700; }
    .footer-credit { margin-left: auto; font-size: .72rem; }
    .footer-credit a { color: inherit; text-underline-offset: 3px; }
  </style>
</head>
<body>

<!-- ── Splash ─────────────────────────────────── -->
<div id="splash">
  <div class="splash-inner">
    <div class="splash-site-title" id="splash-title">学習ノート</div>
    <div class="splash-by">by EbonySerpent</div>
  </div>
</div>

<!-- ── Header ─────────────────────────────────── -->
<header class="site-header">
  <span style="font-size:1.2rem">📚</span>
  <h1 id="site-title">学習ノート</h1>
  <button class="home-link search-link" id="search-btn" aria-label="検索">🔍 検索</button>
  <button class="home-link" id="home-btn">ホームへ</button>
</header>

<!-- ── App ────────────────────────────────────── -->
<main id="app">
  <div class="loading-state"><div class="spinner"></div><p>読み込み中...</p></div>
</main>

<div id="toast" role="status" aria-live="polite"></div>

<!-- ── Footer ────────────────────────────────── -->
<footer class="site-footer">
  <span>© <span id="footer-year"></span> EbonySerpent</span>
  <button class="footer-terms-link" onclick="go('#/terms')">利用規約</button>
  <span class="footer-credit">手書き認識: <a href="https://github.com/asdfjkl/kanjicanvas" target="_blank" rel="noopener">Kanji Canvas</a> © Dominik Klein (MIT)</span>
</footer>

<script>
/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   KaTeX
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
let _katex = false;
function onKaTeXReady() {
  _katex = true;
  renderMath();
}
function renderMath() {
  if (!_katex || typeof renderMathInElement === 'undefined') return;
  renderMathInElement(document.getElementById('app'), {
    delimiters: [
      { left: '$$',  right: '$$',  display: true  },
      { left: '$',   right: '$',   display: false },
      { left: '\\[', right: '\\]', display: true  },
      { left: '\\(', right: '\\)', display: false },
    ],
    throwOnError: false,
  });
}

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   Splash
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
const splash = document.getElementById('splash');
setTimeout(() => {
  splash.classList.add('out');
  setTimeout(() => splash.remove(), 750);
}, 2900);

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   State
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
const S = {
  subjects: [],
  siteTitle: '学習ノート',
  quiz: null,
  quizText: {},   // file -> JSON 文字列（ダウンロード用）
  quizCache: {},  // file -> パース済みクイズ（検索用）
  quizFail: {},
  inflight: {},
  closed: {},     // 閉じているグループ
};

const app     = document.getElementById('app');
const titleEl = document.getElementById('site-title');

document.getElementById('home-btn').addEventListener('click', () => go('#/'));
document.getElementById('search-btn').addEventListener('click', () => go('#/search'));

// data-go / data-dl を持つ要素のクリックをまとめて処理
app.addEventListener('click', e => {
  const dl = e.target.closest('[data-dl]');
  if (dl) { downloadQuiz(dl.dataset.dl); return; }
  const sh = e.target.closest('[data-share]');
  if (sh) { shareQuiz(sh.dataset.share); return; }
  const g = e.target.closest('[data-go]');
  if (g) go(g.dataset.go);
});

// 「/」キーで検索を開く
document.addEventListener('keydown', e => {
  if (e.key !== '/' || e.ctrlKey || e.metaKey || e.altKey) return;
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName || '')) return;
  e.preventDefault();
  if (location.hash.startsWith('#/search')) document.getElementById('search-input')?.focus();
  else go('#/search');
});

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   Boot
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
async function init() {
  window.addEventListener('hashchange', route);
  try {
    const res  = await fetch('data/subjects.json');
    const data = await res.json();
    S.subjects  = data.subjects  || [];
    S.siteTitle = data.title     || '学習ノート';
    titleEl.textContent = S.siteTitle;
    document.title      = S.siteTitle;
    const st = document.getElementById('splash-title');
    if (st) st.textContent = S.siteTitle;
  } catch {
    S.subjects = null;
  }
  route();
}

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   Router
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
function go(hash) { location.hash = hash; }

function parseQuizHash(rest) {
  const m = rest.match(/^(.*?)(?:\?q=(\d+))?$/);
  return { file: m[1], q: m[2] ? parseInt(m[2], 10) - 1 : null };
}

function route() {
  const h = location.hash || '#/';
  if (h === '#/' || h === '#')          { fade(renderHome); }
  else if (h.startsWith('#/subject/'))  { fade(() => renderSubject(h.slice(10))); }
  else if (h.startsWith('#/quiz/')) {
    const { file, q } = parseQuizHash(h.slice(7));
    if (!S.quiz || S.quiz.file !== file) fade(() => loadQuiz(file, q));
    else fade(() => {
      if (q !== null) S.quiz.idx = Math.max(0, Math.min(S.quiz.data.questions.length - 1, q));
      renderQuizQ();
    });
  }
  else if (h.startsWith('#/view/'))     { fade(() => renderViewer(h.slice(7))); }
  else if (h.startsWith('#/search'))    { fade(() => renderSearch(h.slice(9) || null)); }
  else if (h === '#/terms')             { fade(renderTerms); }
  else                                  { fade(renderHome); }
}

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   Fade transition
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
function fade(renderFn) {
  app.classList.add('fading');
  setTimeout(() => {
    renderFn();
    renderMath();
    requestAnimationFrame(() => requestAnimationFrame(() => app.classList.remove('fading')));
  }, 200);
}

function fadeIn(renderFn) {
  app.classList.add('fading');
  renderFn();
  renderMath();
  requestAnimationFrame(() => requestAnimationFrame(() => app.classList.remove('fading')));
}

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   Helpers
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
const T_ICON  = { pdf:'📄', quiz:'✏️', image:'🖼️' };
const T_LABEL = { pdf:'PDF', quiz:'クイズ', image:'画像' };
const BADGE_L = ['A','B','C','D','E','F'];

function subjectOf(file) {
  return S.subjects?.find(s => s.materials?.some(m => m.file === file));
}
function backOf(file) {
  const s = subjectOf(file);
  return s ? `#/subject/${s.id}` : '#/';
}

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   HOME
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
function renderHome() {
  if (S.subjects === null) {
    app.innerHTML = `<div class="error-box">
      <strong>data/subjects.json を読み込めませんでした</strong><br><br>
      ローカル確認には <code>npx serve .</code> または <code>python3 -m http.server 8000</code> が必要です。<br>
      ファイルをダブルクリックで直接開いても動作しません（fetch 制限）。
    </div>`;
    return;
  }
  if (!S.subjects.length) {
    app.innerHTML = `<div class="error-box">subjects.json に教科が登録されていません。</div>`;
    return;
  }
  const cards = S.subjects.map(s => {
    const c = { pdf:0, quiz:0, image:0 };
    (s.materials||[]).forEach(m => { if (m.type in c) c[m.type]++; });
    const badges = Object.entries(c)
      .filter(([,n]) => n > 0)
      .map(([t,n]) => `<span class="count-badge">${T_ICON[t]} ${T_LABEL[t]} ${n}</span>`)
      .join('');
    return `
      <div class="subject-card" onclick="location.hash='#/subject/${s.id}'">
        <span class="subject-emoji">${s.icon||'📚'}</span>
        <div>
          <div class="subject-name">${s.name}</div>
          <div class="count-badges">${badges||'<span class="count-badge">教材なし</span>'}</div>
        </div>
      </div>`;
  }).join('');

  app.innerHTML = `
    <button class="home-search" data-go="#/search"><span aria-hidden="true">🔍</span><span>教材・問題を検索</span><kbd>/</kbd></button>
    <div class="page-title">教科を選択</div><div class="subjects-grid">${cards}</div>`;
}

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   SUBJECT DETAIL
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
function renderSubject(id) {
  const s = S.subjects?.find(x => x.id === id);
  if (!s) { renderHome(); return; }

  const ORDER = ['quiz','pdf','image'];
  const NAMES = { quiz:'クイズ', pdf:'PDF ノート', image:'画像・図' };
  const ord   = t => { const i = ORDER.indexOf(t); return i < 0 ? 99 : i; };
  const mats  = s.materials || [];

  const row = m => {
    const dest = m.type === 'quiz' ? `#/quiz/${m.file}` : `#/view/${m.file}`;
    const dl = m.type === 'quiz'
      ? `<button class="dl-btn" data-dl="${esc(m.file)}" title="オフライン版用のJSONをダウンロード" aria-label="JSONをダウンロード">⬇<span class="dl-text"> JSON</span></button>
         <button class="dl-btn" data-share="${esc(m.file)}" title="JSONを共有" aria-label="JSONを共有">↗<span class="dl-text"> 共有</span></button>`
      : '';
    return `
        <div class="mat-item">
          <span class="mat-icon">${T_ICON[m.type] || '📎'}</span>
          <span class="mat-title">${m.title}</span>
          ${dl}
          <button class="open-btn" data-go="${esc(dest)}">開く</button>
        </div>`;
  };

  let body;
  if (!mats.some(m => m.group)) {
    // グループ指定が無い教科は従来どおり「種類別」に表示
    const g = {};
    mats.forEach(m => { (g[m.type] ??= []).push(m); });
    body = ORDER.filter(t => g[t]).map(t => `
      <div class="mat-section">
        <div class="mat-label">${NAMES[t]}</div>
        <div class="mat-list">${g[t].map(row).join('')}</div>
      </div>`).join('');
  } else {
    // グループ指定あり: subject.groups で順序指定（省略可）。未指定は登場順。グループ無しは末尾「その他」
    const order = [...(s.groups || [])];
    mats.forEach(m => { if (m.group && !order.includes(m.group)) order.push(m.group); });
    if (mats.some(m => !m.group)) order.push('');

    body = order.map(name => {
      const list = mats.filter(m => (m.group || '') === name)
                       .sort((a, b) => ord(a.type) - ord(b.type));
      if (!list.length) return '';
      const key = `${s.id}|${name}`;
      const c = {};
      list.forEach(m => { c[m.type] = (c[m.type] || 0) + 1; });
      const badges = ORDER.filter(t => c[t])
        .map(t => `<span class="count-badge">${T_ICON[t]} ${c[t]}</span>`).join('');
      return `
        <details class="group" data-gkey="${esc(key)}" ${S.closed[key] ? '' : 'open'}>
          <summary><span class="group-name">${name || 'その他'}</span><span class="count-badges">${badges}</span></summary>
          <div class="mat-list">${list.map(row).join('')}</div>
        </details>`;
    }).join('');
  }

  app.innerHTML = `
    <button class="back-btn" onclick="go('#/')">← 教科一覧</button>
    <div class="subject-header">
      <span class="subject-icon-lg">${s.icon||'📚'}</span>
      <h2>${s.name}</h2>
      <button class="tool-btn" data-go="#/search/${esc(s.id)}">🔍 この教科を検索</button>
    </div>
    ${body||'<p style="color:var(--ink-2)">教材が登録されていません</p>'}`;

  app.querySelectorAll('details.group').forEach(d =>
    d.addEventListener('toggle', () => { S.closed[d.dataset.gkey] = !d.open; }));
}

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   QUIZ
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
async function loadQuiz(file, startIdx = null) {
  app.innerHTML = `<div class="loading-state"><div class="spinner"></div><p>読み込み中...</p></div>`;
  app.classList.remove('fading');
  try {
    const data = await getQuiz(file);
    S.quiz = { data, file, sid: subjectOf(file)?.id || null, idx: 0, ans: [], navOpen: false };
    if (data.questions.some(q => q.type === 'write')) Recog.preload();
    if (startIdx !== null && !isNaN(startIdx))
      S.quiz.idx = Math.max(0, Math.min(data.questions.length - 1, startIdx));
    fadeIn(renderQuizQ);
  } catch(e) {
    app.innerHTML = `<div class="error-box">クイズを読み込めませんでした<br><code>${esc(file)}</code><br>${esc(e.message)}</div>`;
    app.classList.remove('fading');
  }
}

function renderQuizQ(noAnim = false) {
  const Q = S.quiz;
  const { data, idx } = Q;
  const q     = data.questions[idx];
  const total = data.questions.length;
  const done  = Q.ans[idx] !== undefined;
  const bk    = Q.sid ? `#/subject/${Q.sid}` : '#/';

  let answered = 0;
  for (let i = 0; i < total; i++) if (Q.ans[i] !== undefined) answered++;

  const isWrite = q.type === 'write';
  const D = isWrite ? getDraft(Q, idx) : null;
  const choiceLayout = (!isWrite && q.choices.length <= 2) ? 'style="flex-direction:row;flex-wrap:wrap;"' : '';
  const choices = isWrite ? '' : q.choices.map((c,i) => {
    let cls = 'choice-btn', dis = '';
    if (done) {
      dis = 'disabled';
      if      (i === q.answer)    cls += ' correct';
      else if (i === Q.ans[idx])  cls += ' wrong';
    }
    return `
      <button class="${cls}" ${dis} onclick="answerQ(${i})">
        <span class="badge">${BADGE_L[i]}</span>
        <span>${c}</span>
      </button>`;
  }).join('');

  const explain = ((done || (isWrite && D.checked)) && q.explanation)
    ? `<div class="explain-box">${q.explanation}</div>` : '';

  const isLast   = idx + 1 >= total;
  const nxtLabel = done ? (isLast ? '結果を見る →' : '次の問題 →')
                        : (isLast ? '結果を見る'   : 'スキップ →');

  const cells = data.questions.map((qq, i) => {
    const a   = Q.ans[i];
    const cls = ['qn', i === idx ? 'cur' : '', a === undefined ? '' : (isRight(qq, a) ? 'ok' : 'ng')]
                  .filter(Boolean).join(' ');
    return `<button class="${cls}" data-q="${i}" aria-label="問${i+1}"${i === idx ? ' aria-current="true"' : ''}>${i+1}</button>`;
  }).join('');

  app.innerHTML = `
    <div class="quiz-wrap">
      <button class="back-btn" onclick="location.hash='${bk}'">← 戻る</button>
      <div class="quiz-meta">
        <div class="quiz-title">${data.title || 'クイズ'}</div>
        <div class="prog-bar"><div class="prog-fill" style="width:${(idx+1)/total*100}%"></div></div>
        <div class="prog-text">${idx+1} / ${total} 問　回答済み ${answered}</div>
      </div>

      <div class="quiz-tools">
        <div class="jump">
          <label for="jump-input">問題番号へ</label>
          <input type="number" id="jump-input" min="1" max="${total}" value="${idx+1}" inputmode="numeric" />
          <button class="tool-btn" id="jump-go">移動</button>
        </div>
        <div class="tool-spacer"></div>
        <button class="tool-btn" id="nav-toggle" aria-expanded="${!!Q.navOpen}">${Q.navOpen ? '一覧 ▴' : '一覧 ▾'}</button>
        <button class="tool-btn" id="dl-btn" title="オフライン版プレーヤー用のJSONを保存">⬇ JSON</button>
        <button class="tool-btn" id="share-btn" title="JSONを共有">↗ 共有</button>
      </div>

      <div class="qnav" id="qnav" ${Q.navOpen ? '' : 'hidden'}>
        <div class="qnav-grid">${cells}</div>
        <div class="qnav-foot">
          <span class="lg ok"><i></i>正解</span>
          <span class="lg ng"><i></i>不正解</span>
          <span class="lg"><i></i>未回答</span>
          <button class="tool-btn" id="goto-result">結果を見る</button>
        </div>
      </div>

      <div class="quiz-card${noAnim ? ' no-anim' : ''}">
        <div class="q-text">Q${idx+1}. ${q.question}</div>
        ${isWrite ? writeCardHTML(q, idx, D) : `<div class="choices" ${choiceLayout}>${choices}</div>`}
        ${explain}
      </div>

      <div class="nav-row">
        <button class="prev-btn" id="prv" ${idx === 0 ? 'disabled' : ''}>← 前へ</button>
        <button class="next-btn${done ? '' : ' skip'}" id="nxt">${nxtLabel}</button>
      </div>
    </div>`;

  if (isWrite) mountWrite(Q, idx);
  document.getElementById('nxt').addEventListener('click', nextQ);
  document.getElementById('prv').addEventListener('click', () => gotoQ(idx - 1));
  document.getElementById('dl-btn').addEventListener('click', () => downloadQuiz(Q.file));
  document.getElementById('share-btn').addEventListener('click', () => shareQuiz(Q.file));

  // ── 番号ジャンプ ──
  const input  = document.getElementById('jump-input');
  const doJump = () => {
    const n = parseInt(input.value, 10);
    if (isNaN(n)) { toast(`1〜${total} の番号を入力してください`); input.value = idx + 1; return; }
    if (n < 1 || n > total) toast(`1〜${total} の範囲で入力してください`);
    gotoQ(Math.min(total, Math.max(1, n)) - 1);
  };
  document.getElementById('jump-go').addEventListener('click', doJump);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); doJump(); } });
  input.addEventListener('focus', () => input.select());

  // ── 一覧パネル ──
  const tgl = document.getElementById('nav-toggle');
  const pnl = document.getElementById('qnav');
  tgl.addEventListener('click', () => {
    Q.navOpen = !Q.navOpen;
    pnl.hidden = !Q.navOpen;
    tgl.setAttribute('aria-expanded', String(Q.navOpen));
    tgl.textContent = Q.navOpen ? '一覧 ▴' : '一覧 ▾';
  });
  pnl.querySelectorAll('.qn').forEach(b => b.addEventListener('click', () => gotoQ(+b.dataset.q)));
  document.getElementById('goto-result').addEventListener('click', () => fade(renderResult));
}

function answerQ(i) {
  if (S.quiz.ans[S.quiz.idx] !== undefined) return;
  S.quiz.ans[S.quiz.idx] = i;
  renderQuizQ(true);
  renderMath();
}

function gotoQ(i) {
  const total = S.quiz.data.questions.length;
  S.quiz.idx = Math.max(0, Math.min(total - 1, i));
  renderQuizQ();
  renderMath();
  window.scrollTo({ top: 0 });
}

function nextQ() {
  const Q = S.quiz;
  if (Q.idx + 1 >= Q.data.questions.length) { fade(renderResult); return; }
  const card = document.querySelector('.quiz-card');
  if (card) {
    card.classList.add('leaving');
    setTimeout(() => gotoQ(Q.idx + 1), 180);
  } else {
    gotoQ(Q.idx + 1);
  }
}

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   RESULT
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
function renderResult() {
  const Q = S.quiz;
  const { data, ans } = Q;
  const { file, sid } = Q;
  const bk = sid ? `#/subject/${sid}` : '#/';
  const total = data.questions.length;
  let score = 0, answered = 0, firstBlank = -1;
  data.questions.forEach((q, i) => {
    if (ans[i] === undefined) { if (firstBlank < 0) firstBlank = i; }
    else { answered++; if (isRight(q, ans[i])) score++; }
  });
  const blank = total - answered;
  const pct   = Math.round(score / total * 100);
  const [emoji, msg] =
    pct===100 ? ['🎉','パーフェクト！完璧です！'] :
    pct>=80   ? ['👏','よくできました！'] :
    pct>=60   ? ['💪','もう少しで完璧！'] :
               ['📖','復習してもう一度！'];

  app.innerHTML = `
    <div class="quiz-wrap">
      <div class="result-card">
        <div class="result-emoji bounce">${emoji}</div>
        <div class="result-score"><span id="r-score">0</span><span class="result-denom"> / ${total}</span></div>
        <div class="result-pct">${pct}% 正解${blank ? `　未回答 ${blank} 問` : ''}</div>
        <div class="result-msg">${msg}</div>
        <div class="result-acts">
          <button class="btn-fill"  id="r-retry">もう一度挑戦</button>
          ${blank ? '<button class="btn-ghost" id="r-blank">未回答の問題へ</button>' : ''}
          <button class="btn-ghost" id="r-review">見直す</button>
          <button class="btn-ghost" id="r-back">教材一覧に戻る</button>
        </div>
      </div>
    </div>`;

  animateCount(document.getElementById('r-score'), score, 750);
  document.getElementById('r-retry').addEventListener('click', () => {
    S.quiz = null; fade(() => loadQuiz(file));
  });
  document.getElementById('r-blank')?.addEventListener('click', () => fade(() => gotoQ(firstBlank)));
  document.getElementById('r-review').addEventListener('click', () => fade(() => gotoQ(0)));
  document.getElementById('r-back').addEventListener('click', () => go(bk));
}

function renderViewer(file) {
  const bk   = backOf(file);
  const name = file.split('/').pop();
  const isPdf = /\.pdf$/i.test(file);
  const isImg = /\.(png|jpe?g|gif|webp|svg)$/i.test(file);

  let body;
  if      (isPdf) body = `<iframe class="pdf-frame" src="${file}" title="${name}"></iframe>`;
  else if (isImg) body = `<div class="img-viewer"><img src="${file}" alt="${name}" /></div>`;
  else            body = `<div class="error-box">プレビューできません: <code>${name}</code></div>`;

  app.innerHTML = `
    <button class="back-btn" onclick="go('${bk}')">← 戻る</button>
    ${body}`;
}

/* ── 手書き認識エンジン（Kanji Canvas を Web Worker で実行）── */
const Recog = (() => {
  let worker = null, failed = false, supported = null, nextId = 1;
  const pending = new Map();
  let readyRes; const ready = new Promise(r => { readyRes = r; });

  function start() {
    if (worker || failed) return;
    try {
      worker = new Worker('hw/recognizer-worker.js');
      worker.onmessage = e => {
        const m = e.data;
        if (m.type === 'ready') { supported = new Set(m.chars); readyRes(true); }
        else if (m.type === 'result') { const p = pending.get(m.id); if (p) { pending.delete(m.id); p(m.cands); } }
      };
      worker.onerror = () => {
        failed = true; readyRes(false);
        pending.forEach(p => p(null)); pending.clear();
      };
    } catch { failed = true; readyRes(false); }
  }
  return {
    get available() { return !failed; },
    preload: start,
    ready,
    supports: ch => !!supported && supported.has(ch),
    recognize(strokes) {
      start();
      if (failed) return Promise.resolve(null);
      return new Promise(res => {
        const id = nextId++;
        pending.set(id, res);
        ready.then(ok => { if (!ok) { pending.delete(id); res(null); } else worker.postMessage({ id, strokes }); });
      });
    },
  };
})();

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   手書き問題（type: "write"）
   白い枠に書いた字を認識して、answer と合っているか判定する。
   認識エンジンが無い環境では、答えを見て自分で○×をつける。
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
const HW = {
  accept: (() => {
    try { const n = parseInt(localStorage.getItem('hw-accept'), 10); return [1, 3, 5].includes(n) ? n : 3; }
    catch { return 3; }
  })(),
};

const hwEsc = s => String(s ?? '')
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

// 正誤判定（選択問題は番号、手書き問題は {ok} オブジェクト）
function isRight(q, a) {
  if (a === undefined) return false;
  return q.type === 'write' ? !!(a && a.ok) : a === q.answer;
}

function wChars(q) { return Array.from(String(q.answer ?? '').replace(/\s+/g, '')); }

function getDraft(Q, i) {
  if (!Q.drafts) Q.drafts = [];
  if (!Q.drafts[i]) {
    Q.drafts[i] = {
      boxes: wChars(Q.data.questions[i]).map(() => ({ strokes: [], cands: null, ver: 0, recVer: -1 })),
      checked: false, checking: false, results: null, engineOk: false,
    };
  }
  return Q.drafts[i];
}

// 1つの書き込み欄にペン入力をつなぐ。座標は 0〜256 の正方形に正規化して box.strokes に積む
function hwAttach(cv, box, isLocked, onStart, onEnd) {
  const ctx = cv.getContext('2d');
  const W = cv.width, k = W / 256, INK = '#1c1b1f';
  const setLine = () => { ctx.lineWidth = 15; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = INK; ctx.fillStyle = INK; };
  const clamp = v => Math.max(0, Math.min(256, v));
  const pt = e => {
    const r = cv.getBoundingClientRect();
    return [clamp((e.clientX - r.left) / r.width * 256), clamp((e.clientY - r.top) / r.height * 256)];
  };

  function redraw() {
    ctx.clearRect(0, 0, W, W);
    setLine();
    box.strokes.forEach(s => {
      ctx.beginPath();
      s.forEach(([x, y], i) => i ? ctx.lineTo(x * k, y * k) : ctx.moveTo(x * k, y * k));
      ctx.stroke();
    });
  }

  let cur = null, pid = null;
  cv.addEventListener('pointerdown', e => {
    if (isLocked() || pid !== null) return;
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    e.preventDefault();
    pid = e.pointerId;
    try { cv.setPointerCapture(pid); } catch {}
    cur = [pt(e)];
    setLine(); ctx.beginPath(); ctx.arc(cur[0][0] * k, cur[0][1] * k, 7.5, 0, Math.PI * 2); ctx.fill();
    onStart && onStart();
  });
  cv.addEventListener('pointermove', e => {
    if (e.pointerId !== pid || !cur) return;
    const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [];
    for (const ev of (evs.length ? evs : [e])) {
      const p = pt(ev), last = cur[cur.length - 1];
      if (Math.hypot(p[0] - last[0], p[1] - last[1]) < 1.2) continue;
      cur.push(p);
      setLine(); ctx.beginPath(); ctx.moveTo(last[0] * k, last[1] * k); ctx.lineTo(p[0] * k, p[1] * k); ctx.stroke();
    }
  });
  const end = e => {
    if (e.pointerId !== pid) return;
    pid = null;
    if (!cur) return;
    if (cur.length === 1) cur.push([cur[0][0] + .3, cur[0][1]]);   // 点（てん）
    box.strokes.push(cur); box.ver++;
    cur = null;
    redraw();
    onEnd && onEnd();
  };
  cv.addEventListener('pointerup', end);
  cv.addEventListener('pointercancel', e => { if (e.pointerId === pid) { pid = null; cur = null; redraw(); } });
  return { redraw };
}

// 認識（書いた直後に先回りして計算しておく。結果は box.cands に入る）
function hwRecognize(box) {
  if (!box.strokes.length) return Promise.resolve([]);
  if (!Recog.available)    return Promise.resolve(null);
  if (box.recVer === box.ver)  return Promise.resolve(box.cands);
  if (box.pendVer === box.ver) return box.pend;
  const v = box.ver;
  box.pendVer = v;
  box.pend = Recog.recognize(box.strokes).then(c => {
    if (c !== null && box.ver === v) { box.cands = c; box.recVer = v; }
    return c;
  });
  return box.pend;
}
function hwSchedule(box) { clearTimeout(box.t); box.t = setTimeout(() => hwRecognize(box), 700); }

function writeCardHTML(q, idx, D) {
  const Q = S.quiz;
  const chars = wChars(q);
  const a = Q.ans[idx], done = a !== undefined;
  const avail = Math.min((app.clientWidth || 360) - 64, 560);
  const size  = Math.max(84, Math.min(190, Math.floor((avail - 12 * (chars.length - 1)) / chars.length)));
  const pass  = r => r.rank >= 0 && r.rank < HW.accept;

  const cells = chars.map((c, i) => {
    const r   = D.results && D.results[i];
    const cls = r && D.engineOk ? (pass(r) ? ' ok' : ' ng') : '';
    const cap = (D.checked && r && D.engineOk) ? `${pass(r) ? '○' : '×'} 認識: ${hwEsc(r.top.join(' ')) || '—'}` : '';
    return `<div class="wcell">
        <div class="wbox${cls}${D.checked ? ' locked' : ''}" data-b="${i}" style="width:${size}px">
          <canvas width="512" height="512" role="img" aria-label="${i + 1}文字目の書き込み欄"></canvas>
          <span class="wbox-no">${i + 1}</span>
        </div>
        <div class="wcap">${cap}</div>
      </div>`;
  }).join('');

  let tail = '';
  if (!D.checked) {
    const opt = (n, label) => `<option value="${n}"${HW.accept === n ? ' selected' : ''}>${label}</option>`;
    tail = `
      <div class="w-actions">
        <button class="tool-btn" id="w-undo">↶ 1画戻す</button>
        <button class="tool-btn" id="w-clear">全部消す</button>
        <span class="tool-spacer"></span>
        ${Recog.available ? `<label class="w-accept">判定 <select id="w-accept">${opt(5,'ゆるい')}${opt(3,'ふつう')}${opt(1,'きびしい')}</select></label>` : ''}
        <button class="tool-btn" id="w-giveup">わからない</button>
        <button class="w-check" id="w-check">答え合わせ</button>
      </div>
      <div class="w-status" id="w-status">${Recog.available ? '' : 'この環境では手書き認識を使えません。書いたあとで答えを見て、自分で○×をつけます。'}</div>`;
  } else {
    tail = `
      <div class="w-answer"><span class="w-answer-label">正解</span><span class="w-answer-text">${hwEsc(q.answer)}</span></div>
      <div class="w-judge">
        <span>${D.engineOk ? '自動判定（直せます）' : '自分で判定'}</span>
        <button class="tool-btn${done && a.ok ? ' on-ok' : ''}"  data-j="1">○ 合ってた</button>
        <button class="tool-btn${done && !a.ok ? ' on-ng' : ''}" data-j="0">× 違った</button>
      </div>
      ${D.engineOk ? '<div class="w-status">手書き認識はまちがえることがあります。実際は合っていた・違っていた場合は、上のボタンで直してください。</div>'
                   : (!done ? '<div class="w-status">この問題は自動判定できません。答えを見て、自分で判定してください。</div>' : '')}`;
  }
  return `<div class="w-hint">✍️ 手書き問題　白い枠に1文字ずつ書こう（${chars.length}文字）</div>
      <div class="wbox-row" id="wbox-row">${cells}</div>${tail}`;
}

function mountWrite(Q, idx) {
  const D   = getDraft(Q, idx);
  const row = document.getElementById('wbox-row');
  if (!row) return;
  let active = Math.max(0, D.boxes.map(b => b.strokes.length > 0).lastIndexOf(true));
  const els = row.querySelectorAll('.wbox');

  els.forEach((el, i) => {
    const box = D.boxes[i];
    const h = hwAttach(el.querySelector('canvas'), box,
      () => D.checked || D.checking,
      () => { active = i; els.forEach(x => x.classList.remove('active')); el.classList.add('active'); },
      () => hwSchedule(box));
    box.redraw = h.redraw;
    h.redraw();
  });

  document.querySelectorAll('.w-judge [data-j]').forEach(b =>
    b.addEventListener('click', () => judgeWrite(idx, b.dataset.j === '1')));
  if (D.checked) return;

  Recog.preload();
  const $ = id => document.getElementById(id);
  $('w-undo').addEventListener('click', () => {
    const b = D.boxes[active];
    if (!b || !b.strokes.length) return;
    b.strokes.pop(); b.ver++; b.redraw(); hwSchedule(b);
  });
  $('w-clear').addEventListener('click', () => {
    D.boxes.forEach(b => { b.strokes = []; b.ver++; b.cands = null; b.recVer = -1; b.redraw(); });
  });
  $('w-giveup').addEventListener('click', () => giveUpWrite(idx));
  $('w-check').addEventListener('click', () => checkWrite(idx));
  $('w-accept')?.addEventListener('change', e => {
    HW.accept = +e.target.value;
    try { localStorage.setItem('hw-accept', String(HW.accept)); } catch {}
  });
}

async function checkWrite(idx) {
  const Q = S.quiz, q = Q.data.questions[idx], D = getDraft(Q, idx);
  if (D.checked || D.checking) return;
  if (D.boxes.every(b => !b.strokes.length)) { toast('先に書いてみよう'); return; }

  D.checking = true;
  const st = document.getElementById('w-status');
  if (st) st.textContent = '判定中…（初回は認識データを読み込むので少し時間がかかります）';
  document.querySelectorAll('.w-actions button, .w-actions select').forEach(b => { b.disabled = true; });

  const chars = wChars(q);
  const res   = await Promise.all(D.boxes.map(hwRecognize));
  const engineOk = Recog.available && res.every(r => r !== null) && chars.every(c => Recog.supports(c));

  D.results  = chars.map((c, i) => { const cands = res[i] || []; return { rank: cands.indexOf(c), top: cands.slice(0, 3) }; });
  D.engineOk = engineOk;
  D.checking = false;
  D.checked  = true;
  if (engineOk) Q.ans[idx] = { ok: D.results.every(r => r.rank >= 0 && r.rank < HW.accept), auto: true };

  if (S.quiz === Q && Q.idx === idx) { renderQuizQ(true); renderMath(); }
}

function giveUpWrite(idx) {
  const Q = S.quiz, D = getDraft(Q, idx);
  if (D.checked || D.checking) return;
  D.checked = true; D.results = null; D.engineOk = false;
  Q.ans[idx] = { ok: false, auto: false, gaveUp: true };
  renderQuizQ(true); renderMath();
}

function judgeWrite(idx, ok) {
  S.quiz.ans[idx] = { ok, auto: false };
  renderQuizQ(true); renderMath();
}

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   Quiz data cache / JSON download
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
const esc = s => String(s ?? '')
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

async function fetchQuizText(file) {
  if (S.quizText[file]) return S.quizText[file];
  const res = await fetch(file);
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const text = await res.text();
  S.quizText[file] = text;
  return text;
}

async function getQuiz(file) {
  if (S.quizCache[file]) return S.quizCache[file];
  const text = await fetchQuizText(file);
  const data = JSON.parse(text);
  if (!data || !Array.isArray(data.questions) || !data.questions.length)
    throw new Error('questions 配列が見つかりません');
  S.quizCache[file] = data;
  return data;
}

function baseName(file) {
  let n = file.split('?')[0].split('/').pop() || 'quiz.json';
  try { n = decodeURIComponent(n); } catch {}
  return /\.json$/i.test(n) ? n : n + '.json';
}

async function downloadQuiz(file) {
  try {
    const text = await fetchQuizText(file);
    const blob = new Blob([text], { type: 'application/json;charset=utf-8' });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href = url;
    a.download = baseName(file);
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1500);
    toast(`${baseName(file)} を保存しました`);
  } catch (e) {
    toast('ダウンロードに失敗しました');
  }
}

// 共有: 端末の共有シートで JSON ファイルを送る。ファイル共有に非対応なら、クイズへのリンクを共有（またはコピー）
async function shareQuiz(file) {
  const name = baseName(file);
  const link = `${location.href.split('#')[0]}#/quiz/${file}`;
  let text;
  try {
    text = await fetchQuizText(file);
  } catch {
    toast('読み込みに失敗しました'); return;
  }
  try {
    if (navigator.share && navigator.canShare) {
      for (const type of ['application/json', 'text/plain']) {
        const f = new File([text], name, { type });
        if (navigator.canShare({ files: [f] })) {
          await navigator.share({ files: [f], title: name });
          return;
        }
      }
    }
    if (navigator.share) {
      await navigator.share({ title: name, url: link });
      toast('この端末はファイル共有に非対応のため、リンクを共有しました');
      return;
    }
    await navigator.clipboard.writeText(link);
    toast('共有に非対応のため、リンクをコピーしました');
  } catch (e) {
    if (e && e.name === 'AbortError') return;                 // 共有シートを閉じただけ
    if (e && e.name === 'NotAllowedError') { toast('もう一度押してください'); return; }  // 読み込み待ちで操作の有効期限が切れた場合
    toast('共有できませんでした。ダウンロードをお使いください');
  }
}

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   Toast
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
let _toastT;
function toast(msg) {
  const el = document.getElementById('toast');
  if (!el) return;
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(_toastT);
  _toastT = setTimeout(() => el.classList.remove('show'), 2200);
}

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   SEARCH
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
const SQ = { q: '', scope: null };

// 全角→半角・カタカナ→ひらがな・小文字化（文字数を変えないので位置がずれない）
function fold(s) {
  s = String(s ?? '');
  let o = '';
  for (let i = 0; i < s.length; i++) {
    let c = s.charCodeAt(i);
    if      (c >= 0xFF01 && c <= 0xFF5E) c -= 0xFEE0;
    else if (c >= 0x30A1 && c <= 0x30F6) c -= 0x60;
    else if (c === 0x3000)               c = 0x20;
    const ch = String.fromCharCode(c);
    const lo = ch.toLowerCase();
    o += lo.length === 1 ? lo : ch;
  }
  return o;
}

// 数式記号・タグを外した表示用テキスト
function plain(s) {
  return String(s ?? '')
    .replace(/<[^>]*>/g, '')
    .replace(/\$+/g, '')
    .replace(/\\[\[\]()]/g, '')
    .replace(/\\/g, '')
    .replace(/\s+/g, ' ')
    .trim();
}

function hl(text, terms) {
  if (!terms.length) return esc(text);
  const f = fold(text);
  const marks = new Array(text.length).fill(false);
  terms.forEach(t => {
    let p = f.indexOf(t);
    while (p >= 0) {
      for (let k = p; k < p + t.length; k++) marks[k] = true;
      p = f.indexOf(t, p + t.length);
    }
  });
  let out = '', open = false;
  for (let i = 0; i < text.length; i++) {
    if (marks[i] && !open)  { out += '<mark>'; open = true; }
    if (!marks[i] && open)  { out += '</mark>'; open = false; }
    out += esc(text[i]);
  }
  return out + (open ? '</mark>' : '');
}

function snippet(text, terms, len = 88) {
  const f = fold(text);
  let pos = -1;
  terms.forEach(t => { const p = f.indexOf(t); if (p >= 0 && (pos < 0 || p < pos)) pos = p; });
  const start = pos > 30 ? pos - 30 : 0;
  const s = text.slice(start, start + len);
  return (start > 0 ? '…' : '') + hl(s, terms) + (start + len < text.length ? '…' : '');
}

function searchScopeMats() {
  return (S.subjects || [])
    .filter(s => !SQ.scope || s.id === SQ.scope)
    .flatMap(s => (s.materials || []).map(m => ({ s, m })));
}

function searchAll(terms) {
  const mats = [], qs = [];
  searchScopeMats().forEach(({ s, m }) => {
    const meta = [s.name, m.group].filter(Boolean).join(' ');
    const hay  = fold(plain(`${meta} ${m.title}`));
    if (terms.every(t => hay.includes(t))) mats.push({ s, m });

    const data = m.type === 'quiz' ? S.quizCache[m.file] : null;
    if (!data) return;
    const hits = [];
    data.questions.forEach((q, i) => {
      const fq = plain(q.question);
      const fc = plain(q.type === 'write' ? `答え ${q.answer}` : (q.choices || []).join(' ／ '));
      const fe = plain(q.explanation || '');
      const all = fold(`${fq} ${fc} ${fe}`);
      if (terms.every(t => all.includes(t))) hits.push({ i, fq, fc, fe, w: q.type === 'write' });
    });
    if (hits.length) qs.push({ s, m, hits });
  });
  return { mats, qs };
}

function renderSearchResults() {
  const box    = document.getElementById('search-results');
  const status = document.getElementById('search-status');
  if (!box || !status) return;

  const quizzes = searchScopeMats().filter(x => x.m.type === 'quiz');
  const pending = quizzes.filter(x => !S.quizCache[x.m.file] && !S.quizFail[x.m.file]).length;
  const failed  = quizzes.filter(x => S.quizFail[x.m.file]).length;
  const note = (pending ? `　（問題文を読み込み中… 残り ${pending}）` : '')
             + (failed  ? `　（${failed} 件のクイズは読み込めませんでした）` : '');

  const terms = fold(SQ.q).split(/\s+/).filter(Boolean);
  if (!terms.length) {
    box.innerHTML = '';
    status.textContent = '教材名・グループ名・問題文・選択肢・解説から探します。スペースで区切ると AND 検索になります。' + note;
    return;
  }

  const { mats, qs } = searchAll(terms);
  const nQ = qs.reduce((a, x) => a + x.hits.length, 0);
  status.textContent = `教材 ${mats.length} 件 ／ 問題 ${nQ} 問${note}`;

  if (!mats.length && !nQ) {
    box.innerHTML = `<div class="error-box">「${esc(SQ.q.trim())}」に一致するものはありません。別のキーワードで試してください。</div>`;
    return;
  }

  let html = '';
  if (mats.length) {
    html += `<div class="mat-section"><div class="mat-label">教材</div><div class="mat-list">` +
      mats.slice(0, 40).map(({ s, m }) => {
        const dest = m.type === 'quiz' ? `#/quiz/${m.file}` : `#/view/${m.file}`;
        const meta = [s.name, m.group].filter(Boolean).join(' › ');
        return `
        <div class="mat-item">
          <span class="mat-icon">${T_ICON[m.type] || '📎'}</span>
          <span class="mat-title">${hl(plain(m.title), terms)}<small>${esc(meta)}</small></span>
          <button class="open-btn" data-go="${esc(dest)}">開く</button>
        </div>`;
      }).join('') + `</div></div>`;
  }

  if (nQ) {
    const CAP = 60;
    let shown = 0;
    html += `<div class="mat-section"><div class="mat-label">問題</div>`;
    qs.forEach(({ s, m, hits }) => {
      if (shown >= CAP) return;
      const take = hits.slice(0, CAP - shown);
      shown += take.length;
      const meta = [s.name, m.group].filter(Boolean).join(' › ');
      html += `<div class="s-quiz"><div class="s-quiz-head"><span>✏️</span><b>${esc(plain(m.title))}</b><span class="s-meta">${esc(meta)}</span></div>` +
        take.map(h => {
          const qAll = terms.every(t => fold(h.fq).includes(t));
          const subs = [];
          if (!qAll) {
            if (terms.some(t => fold(h.fc).includes(t))) subs.push([h.w ? '答え' : '選択肢', h.fc]);
            if (terms.some(t => fold(h.fe).includes(t))) subs.push(['解説', h.fe]);
          }
          return `<button class="s-hit" data-go="${esc(`#/quiz/${m.file}?q=${h.i + 1}`)}">
            <span class="s-qn">Q${h.i + 1}</span>
            <span class="s-txt">${snippet(h.fq, terms)}${subs.map(([l, t]) => `<small>${l}: ${snippet(t, terms, 70)}</small>`).join('')}</span>
          </button>`;
        }).join('') + `</div>`;
    });
    if (nQ > shown) html += `<p class="search-more">ほか ${nQ - shown} 問あります。キーワードを絞り込んでください。</p>`;
    html += `</div>`;
  }
  box.innerHTML = html;
}

function renderSearch(scopeId) {
  if (!S.subjects || !S.subjects.length) { renderHome(); return; }
  const sc = scopeId ? S.subjects.find(s => s.id === scopeId) : null;
  SQ.scope = sc ? sc.id : null;

  app.innerHTML = `
    <div class="search-wrap">
      <button class="back-btn" data-go="${sc ? `#/subject/${esc(sc.id)}` : '#/'}">← 戻る</button>
      <div class="search-box">
        <span aria-hidden="true">🔍</span>
        <input id="search-input" type="search" enterkeyhint="search" autocomplete="off" spellcheck="false"
               placeholder="教材名・問題文・解説を検索" aria-label="検索" value="${esc(SQ.q)}" />
      </div>
      ${sc ? `<div class="scope-chip">${sc.icon || '📚'} ${esc(sc.name)} のみ<button data-go="#/search" aria-label="教科の絞り込みを解除">×</button></div>` : ''}
      <div class="search-status" id="search-status" aria-live="polite"></div>
      <div id="search-results"></div>
    </div>`;

  const inp = document.getElementById('search-input');
  let t;
  inp.addEventListener('input', () => {
    SQ.q = inp.value;
    clearTimeout(t);
    t = setTimeout(renderSearchResults, 120);
  });
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') inp.blur(); });
  inp.focus();
  inp.setSelectionRange(inp.value.length, inp.value.length);

  // クイズの中身を（未取得のものだけ）読み込んで検索対象にする
  searchScopeMats().filter(x => x.m.type === 'quiz').forEach(({ m }) => {
    if (S.quizCache[m.file] || S.quizFail[m.file] || S.inflight[m.file]) return;
    S.inflight[m.file] = true;
    getQuiz(m.file)
      .catch(() => { S.quizFail[m.file] = true; })
      .finally(() => { delete S.inflight[m.file]; renderSearchResults(); });
  });
  renderSearchResults();
}

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   HELPERS
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
function animateCount(el, to, dur) {
  if (!el) return;
  const t0  = performance.now();
  const ease = t => 1 - (1-t)**3;
  (function step(now) {
    const p = Math.min((now - t0) / dur, 1);
    el.textContent = Math.round(ease(p) * to);
    if (p < 1) requestAnimationFrame(step);
  })(t0);
}

init();
